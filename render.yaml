# Render Blueprint: Render -> New -> Blueprint -> shu repo tanlanadi.
# Ma'lumotlar Google Firestore'da (Firebase loyihasi), Render'da baza yaratilmaydi.
services:
  - type: web
    name: proyuk-backend
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DEBUG
        value: "False"
      - key: STORE_BACKEND
        value: firestore
      - key: SECRET_KEY
        generateValue: true
      # Quyidagilarni Render panelida o'zingiz kiritasiz (sync: false)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Bajarilgan ishlar fayllari (Supabase Storage, yopiq bucket)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
