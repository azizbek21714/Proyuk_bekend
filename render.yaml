# Render Blueprint: Render → New → Blueprint → shu repo tanlanadi.
# Web xizmat (Django + gunicorn) va PostgreSQL bazasi avtomatik yaratiladi.
services:
  - type: web
    name: proyuk-backend
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: proyuk-db
          property: connectionString
      # Quyidagilarni Render panelida o'zingiz kiritasiz (sync: false)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: proyuk-db
    plan: free
    databaseName: proyuk
    user: proyuk
